services:
  postgres:
    image: postgres:16-alpine
    container_name: domyn-postgres
    environment:
      POSTGRES_USER: domyn
      POSTGRES_PASSWORD: domyn_dev_password
      POSTGRES_DB: domyn
    ports:
      - "5432:5432"
    volumes:
      - domyn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domyn -d domyn"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://domyn:domyn_dev_password@postgres:5432/domyn
      APP_BASE_URL: http://localhost:3000
      APP_TIMEZONE: Asia/Jakarta
      WHATSAPP_PROVIDER: sandbox
      CRON_SECRET: dev-cron-secret-change-me
      SEED_DEMO_PASSWORD: ChangeMe-Dev-Only!
      EXPOSE_RESET_TOKEN: "true"
    ports:
      - "3000:3000"

volumes:
  domyn_pg:
